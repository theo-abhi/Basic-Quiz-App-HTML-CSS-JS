<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="quiz-container">
      <div class="quiz-header">
        <div class="question-number">
          Question <span id="current-question">1/3</span>
        </div>
        <div class="timer">
          <i class="fas fa-clock"></i><span id="time"> 15</span>s
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress" style="width: 10%"></div>
      </div>
      <div class="question">What is the capital of India?</div>
      <div class="options-container">
        <div class="option">New Delhi</div>
        <div class="option">Chandigarh</div>
        <div class="option">Mumbai</div>
        <div class="option">Kolkata</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
